<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 350" width="100%" height="350">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <!-- Text Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&amp;family=Fira+Code:wght@400;500&amp;display=swap');
      
      .title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 32px;
        fill: url(#accentGrad);
        letter-spacing: 1px;
      }
      
      .subtitle {
        font-family: 'Outfit', -apple-system, sans-serif;
        font-weight: 600;
        font-size: 16px;
        fill: #e2e8f0;
        letter-spacing: 0.5px;
      }

      /* CSS Animations */
      @keyframes pulse {
        0% { opacity: 0.15; }
        50% { opacity: 0.35; }
        100% { opacity: 0.15; }
      }
      
      @keyframes pulseGlow {
        0% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.08); opacity: 0.7; }
        100% { transform: scale(1); opacity: 0.4; }
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .animated-grid {
        stroke: #334155;
        stroke-width: 0.75;
        opacity: 0.2;
        animation: pulse 4s infinite ease-in-out;
      }

      .glowing-orb {
        transform-origin: 700px 175px;
        animation: pulseGlow 5s infinite ease-in-out;
      }

      .status-dot {
        fill: #22c55e;
        animation: blink 1.8s infinite steps(1);
      }
      
      .cursor-blink {
        animation: blink 1s infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="850" height="350" rx="16" fill="url(#bgGrad)" />
  <rect width="850" height="350" rx="16" fill="url(#glowGrad)" />

  <!-- Grid Lines (Decorative) -->
  <g class="animated-grid">
    <!-- Horizontal lines -->
    <line x1="0" y1="50" x2="850" y2="50" />
    <line x1="0" y1="100" x2="850" y2="100" />
    <line x1="0" y1="150" x2="850" y2="150" />
    <line x1="0" y1="200" x2="850" y2="200" />
    <line x1="0" y1="250" x2="850" y2="250" />
    <line x1="0" y1="300" x2="850" y2="300" />
    <!-- Vertical lines -->
    <line x1="100" y1="0" x2="100" y2="350" />
    <line x1="200" y1="0" x2="200" y2="350" />
    <line x1="300" y1="0" x2="300" y2="350" />
    <line x1="400" y1="0" x2="400" y2="350" />
    <line x1="500" y1="0" x2="500" y2="350" />
    <line x1="600" y1="0" x2="600" y2="350" />
    <line x1="700" y1="0" x2="700" y2="350" />
    <line x1="800" y1="0" x2="800" y2="350" />
  </g>

  <!-- Glowing Orb/Chess piece representation on the right -->
  <g class="glowing-orb" transform="translate(700, 150)">
    <circle cx="0" cy="0" r="90" fill="url(#accentGrad)" opacity="0.12" filter="blur(25px)" />
    <!-- Symbolic chess representation or grid logo -->
    <circle cx="0" cy="0" r="55" stroke="url(#accentGrad)" stroke-width="1.5" fill="none" opacity="0.4"/>
    <circle cx="0" cy="0" r="35" stroke="#06b6d4" stroke-width="1" fill="none" stroke-dasharray="6,4" opacity="0.6"/>
    <!-- Chess Knight representation -->
    <path d="M 5,45 C 5,20 15,5 30,5 C 33,5 37,7 37,10 C 37,15 25,20 28,30 C 30,35 38,30 42,35 C 45,38 43,45 35,45 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" opacity="0.8" transform="translate(-18, -25) scale(1.1)"/>
    <path d="M -5,22 C -5,22 15,22 25,27 L 25,32 L -15,32 Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8" />
  </g>

  <!-- Left Content -->
  <!-- Terminal window mock -->
  <g transform="translate(50, 45)">
    <!-- Terminal shadow & window -->
    <rect x="0" y="0" width="540" height="240" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
    <!-- Terminal header -->
    <path d="M 0,10 A 10,10 0 0 1 10,0 L 530,0 A 10,10 0 0 1 540,10 L 540,30 L 0,30 Z" fill="#111827" />
    <!-- Window controls -->
    <circle cx="20" cy="15" r="6" fill="#ff5f56" />
    <circle cx="40" cy="15" r="6" fill="#ffbd2e" />
    <circle cx="60" cy="15" r="6" fill="#27c93f" />
    <text x="270" y="20" fill="#64748b" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">nishant@gaurav:~</text>

    <!-- Terminal Content -->
    <g transform="translate(25, 40)">
      <!-- Name -->
      <text x="0" y="25" class="title">Nishant Gaurav</text>
      
      <!-- Role -->
      <text x="0" y="55" class="subtitle">Software Engineer • Full Stack Developer</text>
      
      <!-- Shell Commands & JSON Config -->
      <text x="0" y="90" font-family="'Fira Code', monospace" font-size="13" fill="#818cf8">&gt; npm init @imbiber/developer --yes</text>
      
      <text x="0" y="120" font-family="'Fira Code', monospace" font-size="13" fill="#e2e8f0">
        <tspan fill="#f43f5e">const</tspan> developer = {
      </text>
      <text x="20" y="142" font-family="'Fira Code', monospace" font-size="13" fill="#38bdf8">
        focus: <tspan fill="#fbbf24">["Next.js", "TypeScript", "Docker"]</tspan>,
      </text>
      <text x="20" y="164" font-family="'Fira Code', monospace" font-size="13" fill="#38bdf8">
        chess: <tspan fill="#34d399">{ elo: 1100, active: true }</tspan>,
      </text>
      <text x="20" y="186" font-family="'Fira Code', monospace" font-size="13" fill="#38bdf8">
        typingSpeed: <tspan fill="#a78bfa">"70+ WPM"</tspan>
      </text>
      <text x="0" y="208" font-family="'Fira Code', monospace" font-size="13" fill="#e2e8f0">
        }; <tspan fill="#f43f5e" class="cursor-blink">|</tspan>
      </text>
    </g>
  </g>

  <!-- Status Bar Footer -->
  <g transform="translate(50, 315)">
    <circle cx="10" cy="-4" r="5" class="status-dot" />
    <text x="25" y="0" font-family="'Fira Code', monospace" font-size="12" fill="#64748b">Status: Building robust, scalable full-stack applications</text>
  </g>
</svg>
